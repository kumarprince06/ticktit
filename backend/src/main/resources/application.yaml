server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticktit_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}     # Mailpit in dev; a real provider (SES, Brevo...) in prod
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  threads:
    virtual:
      enabled: true                  # @Async email sending and slow I/O use cheap virtual threads

app:
  demo-data:
    enabled: ${DEMO_DATA:true}   # fictional cinemas, movies and a rolling 7-day show schedule (off in prod)
    # local-only admin account, created once if missing (sign-in still needs the email OTP, which lands in Mailpit)
    admin-email: ${DEMO_ADMIN_EMAIL:admin@yopmail.com}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@123}
  base-url: ${APP_BASE_URL:http://localhost:5173}   # frontend URL, used to build links in emails
  mail:
    from: ${MAIL_FROM:Ticktit <no-reply@ticktit.local>}

google:
  client-id: ${GOOGLE_CLIENT_ID:}   # OAuth client id from Google Cloud Console; Google sign-in is off while empty

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m      # JWT in the response body, kept in memory by the app
  refresh-ttl: 7d      # max session per sign-in, rotation never extends it (ADR-017)

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"   # adds the request id to every log line

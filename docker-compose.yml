services:
  postgres:
    image: postgres:16
    container_name: ticktit-postgres
    environment:
      POSTGRES_DB: ticktit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ticktit_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: ticktit-redis
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:latest
    container_name: ticktit-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ticktit-cluster
    ports:
      - "9092:9092"
volumes:
  ticktit_pgdata:
